name: Go

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
      - release-*

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: false

      - name: Setup format tools
        run: go install tool

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.7.2
          install-mode: goinstall

      - name: format
        run: make strict-fmt
  verify-bundle:
    name: verify bundle
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: resolve bundle comparison branch
        id: bundle-branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TARGET="$BASE_REF"
          else
            TARGET="$HEAD_REF"
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          case "$TARGET" in
            main|release-*)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: bundle
        env:
          TARGET: ${{ steps.bundle-branch.outputs.target }}
        run: |
          case "$TARGET" in
            release-*)
              if [[ ! "$TARGET" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
                echo "Unsupported release branch format: $TARGET" >&2
                exit 1
              fi
              RELEASE_LINE="${TARGET#release-}"
              cd operator && make bundle RELEASE_LINE="$RELEASE_LINE"
              ;;
            *)
              cd operator && make bundle
              ;;
          esac

      # main and release-* branches use dev bundle versions (e.g. 5.0.0-dev / 5.1.0-dev) while the
      # matching release-* branches in multicluster-global-hub-operator-bundle
      # carry GA z-stream versions — skip external sync on those branches.

      - name: compare bundle with stolostron/multicluster-global-hub-operator-bundle
        if: steps.bundle-branch.outputs.skip != 'true'
        env:
          TARGET: ${{ steps.bundle-branch.outputs.target }}
        run: |
          # Ensure the committed bundle matches the release branch in the bundle repo.
          # ignore createdAt updated in csv by `make bundle`
          git checkout . -f
          git clone https://github.com/stolostron/multicluster-global-hub-operator-bundle.git \
            -b "$TARGET"

          diff -I 'createdAt' -ruN operator/bundle multicluster-global-hub-operator-bundle/bundle

  scorecard-test:
    name: bundle scorecard test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1

      - name: Download operator-sdk
        run: make -C operator operator-sdk

      - name: scorecard
        run: |
          export PATH="${{ github.workspace }}/operator/bin:${PATH}"
          cd operator && operator-sdk scorecard ./bundle/
